<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unsubscribe | Plus Mortgage Group</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#002244; font-family:Arial, Helvetica, sans-serif; color:#333; }
  .card { max-width:480px; margin:40px auto; background:#fff; border-radius:6px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .head { background:linear-gradient(135deg,#003366 0%,#001122 100%); color:#fff; padding:20px 26px; }
  .head h1 { margin:0; font-size:22px; }
  .head p { margin:4px 0 0; font-size:13px; color:#ffcc00; font-weight:bold; }
  .body { padding:26px; }
  .body h2 { margin:0 0 10px; font-size:20px; color:#003366; }
  .body p { font-size:15px; line-height:22px; margin:0 0 16px; }
  label { display:block; font-size:13px; font-weight:bold; margin-bottom:6px; }
  input[type=email] { width:100%; padding:12px; font-size:16px; border:1px solid #ccc; border-radius:4px; margin-bottom:16px; }
  button { width:100%; padding:14px; font-size:16px; font-weight:bold; color:#002244; background:#ffcc00; border:0; border-radius:4px; cursor:pointer; }
  button:disabled { background:#bbb; cursor:default; }
  .msg { display:none; }
  .err { color:#b00020; font-size:14px; }
  .foot { padding:14px 26px 22px; font-size:11px; line-height:16px; color:#888; background:#fafafa; }
  @media (max-width:520px) { .card { margin:0; border-radius:0; box-shadow:none; } }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>Plus Mortgage Group, Inc.</h1>
    <p>Direct Lender</p>
  </div>

  <div class="body">
    <!-- Step 1: confirm -->
    <div id="formBox">
      <h2>Unsubscribe</h2>
      <p>Click the button below and we'll stop sending marketing emails to this address.</p>
      <form id="unsubForm" action="https://formspree.io/f/xykeqolw" method="POST">
        <input type="hidden" name="_subject" value="UNSUBSCRIBE REQUEST">
        <input type="hidden" name="name" value="UNSUBSCRIBE">
        <input type="hidden" name="phone" value="-">
        <input type="hidden" name="message" id="msgField" value="Please remove this address from marketing emails.">
        <label for="email">Email address</label>
        <input type="email" id="email" name="_replyto" required placeholder="you@example.com">
        <button type="submit" id="btn">Unsubscribe</button>
      </form>
    </div>
  </div>

  <div class="foot">
    Plus Mortgage Group, Inc. &middot; Company NMLS# 1783260 &middot; Equal Housing Opportunity<br><a href="https://www.plusmtg.com" style="color:#888;">www.plusmtg.com</a>
  </div>
</div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var preset = (params.get("email") || "").trim();
  var input = document.getElementById("email");
  if (preset && preset.indexOf("@") > 0 && !/[{}\[\]]/.test(preset)) input.value = preset;
  document.getElementById("unsubForm").addEventListener("submit", function () {
    document.getElementById("msgField").value = "UNSUBSCRIBE: please remove " + input.value.trim() + " from marketing emails.";
    var btn = document.getElementById("btn"); btn.textContent = "Processing...";
  });
})();
</script>
</body>
</html>
